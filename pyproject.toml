[project]
name = "dialog-dictate"
version = "0.4.0"
description = "Push-to-talk dictation for macOS using PolyAI Dialog-RSN-1"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["dictation", "speech-to-text", "push-to-talk", "macos", "polyai", "dialog-rsn-1"]
# Exact pins, transitive included: `uv tool install` ignores uv.lock. A test keeps them in step.
dependencies = [
    "websockets==17.3",
    "sounddevice==0.5.6; sys_platform == 'darwin'",
    "pynput==1.8.2; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",  # on-screen indicator
    # transitive
    "pyobjc-core==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-CoreText==12.2.2; sys_platform == 'darwin'",
    "cffi==2.1.1; sys_platform == 'darwin'",
    "pycparser==3.11; sys_platform == 'darwin'",
    "six==1.17.0; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/polyai/dialog-dictate"
Documentation = "https://docs.poly.ai/api-reference/dialog-rsn-1/reference"

[project.scripts]
dictate = "dictate:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[build-system]
requires = ["setuptools==84.0.0"]  # pinned: installs build from source
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dictate"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
